schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: fjson — минимальная JSON-библиотека для Forth (write, read-lite, дерево узлов), часть экосистемы VitaSound feco.
  API: doc/API.md. Стек: Gforth, правила frules, package.4th. Потребители: fmcp (MCP NDJSON), тулчейн.
  Проверка: fmix test, flint, fcov run && fcov report; из Cursor — MCP vitasound-forth.

rules:
  specs:
    - Scenario формулировать через входной JSON/вызов слова и ожидаемый вывод или дерево
  tasks:
    - Каждое требование покрывать тестом в tests/*_test.4th

operations:
  apply:
    guidance:
      - Перед завершением прогонять fmix check; обновлять CHANGELOG.md и doc/API.md
